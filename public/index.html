<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3a2b" />
  <title>CricLive — International Cricket</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%23c1121f'/><path d='M6 5.2c3.6 3.2 3.6 10.4 0 13.6M18 5.2c-3.6 3.2-3.6 10.4 0 13.6' stroke='%23f6e7c8' stroke-width='1.3' fill='none' stroke-dasharray='1.6 1.3'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#/" class="brand" aria-label="CricLive home">
        <svg class="brand-ball" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#c1121f" />
          <path d="M6 5.2c3.6 3.2 3.6 10.4 0 13.6M18 5.2c-3.6 3.2-3.6 10.4 0 13.6" stroke="#f6e7c8" stroke-width="1.3" fill="none" stroke-dasharray="1.6 1.3" />
        </svg>
        <span>Cric<em>Live</em></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="home">Live</a>
        <a href="#/schedule" data-nav="schedule">Schedule</a>
        <a href="#/results" data-nav="results">Results</a>
        <a href="#/series" data-nav="series">Series</a>
        <a href="#/teams" data-nav="teams">Teams</a>
        <a href="#/news" data-nav="news">News</a>
      </nav>
      <button class="theme-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <div class="ticker" id="ticker"><div class="wrap ticker-inner" id="tickerInner"></div></div>

  <main class="wrap" id="app"><div class="loading">Loading…</div></main>

  <footer class="footer wrap">
    Men's international cricket: Tests, ODIs and T20Is. Data from ESPN / ESPNcricinfo's public sports API. Personal, non-commercial use.
  </footer>

  <script src="/main.js"></script>
</body>
</html>
